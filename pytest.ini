[pytest]
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Test discovery
testpaths = tests

# Coverage settings. Skip integration/performance by default — those tests
# need a live multi-agent stack we don't spin up in unit-test runs.
# Override with `pytest -m integration` etc. to opt in.
#
# --cov-branch enables branch coverage measurement (PROJECT_REVIEW.md
# recommendation #5). The 70% floor is a hair below current combined
# coverage; ratchet it up as coverage improves. Local runs can override
# with `pytest --no-cov` or `pytest --cov-fail-under=0` when iterating.
addopts = --verbose --cov=agent_mcp_demo --cov-branch --cov-report=term-missing --cov-fail-under=70 -m "not integration and not performance"

# pytest-asyncio 0.23+ requires an explicit mode. `auto` runs every `async
# def test_...` as an asyncio test without needing @pytest.mark.asyncio on
# each one — matches the pre-0.23 behavior the suite was written for and
# un-skips the 12 previously-orphaned async tests.
asyncio_mode = auto

# Environment variables for tests. ALLOW_ANONYMOUS=1 is the explicit
# opt-in for the auth module's dev-mode contract — without it, every
# unauthenticated test request would get 503. Tests that specifically
# exercise the auth path (test_publish_endpoint_boundaries.py) override
# AUTH_TOKEN/ALLOW_ANONYMOUS via monkeypatch to prove each branch.
env =
    GITHUB_TOKEN=test-token
    GITHUB_ORG_NAME=test-org
    ALLOW_ANONYMOUS=1
    PYTHONPATH=src

# Markers
markers =
    integration: marks tests that require external services
    slow: marks tests that are slow running
    performance: marks performance and benchmark tests
    memory: marks tests that check memory usage
    concurrent: marks tests for concurrent operations
    network: marks tests that require network access
