name: Generate Iteration Report

on:
  # Run daily at 5:00 AM UTC to ensure local time is after midnight Eastern and to check if it's the scheduled date
  # 5:00 AM UTC = 12:00 AM EST (midnight) / 1:00 AM EDT
  schedule:
    - cron: '0 5 * * *'  # 5:00 AM UTC = 12:00 AM EST / 1:00 AM EDT
  # Allow manual trigger
  workflow_dispatch:
    inputs:
      ref:
        description: 'Branch or ref to run against (defaults to main)'
        required: false
        default: 'main'
        type: string
      dry_run:
        description: 'Dry run: generate the report and upload as an artifact but do NOT commit/push. Use to test mcp2 end-to-end without touching Pages.'
        required: false
        default: false
        type: boolean

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  generate-report:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          # For scheduled runs and pushes we still want main. Manual dispatch
          # can point at another branch (e.g. mcp2) for end-to-end canary runs.
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.ref || 'main' }}
          token: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install pyyaml
          
      - name: Check if today is scheduled report date
        id: check_date
        env:
          GITHUB_TOKEN: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}
          GITHUB_ORG_NAME: ${{ secrets.ORG_NAME || secrets.GITHUB_ORG_NAME || 'WeMoAD-umich' }}
        run: |
          python - << 'EOF'
          import os
          import sys
          import yaml
          from datetime import datetime
          from zoneinfo import ZoneInfo
          from pathlib import Path
          
          try:
              # Check if this is a manual trigger
              is_manual = '${{ github.event_name }}' == 'workflow_dispatch'
              
              if is_manual:
                  print("Manual workflow trigger detected - will generate report regardless of date")
                  should_generate = True
                  iteration_name = "Manual Run"
                  
                  # Try to get iteration info from schedule file
                  schedule_file = Path(".github/iteration-schedule.yml")
                  if schedule_file.exists():
                      with open(schedule_file) as f:
                          config = yaml.safe_load(f)
                      iteration_name = config.get('next_iteration_name', 'Manual Run')
                  
                  # Write output
                  with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
                      f.write('should_generate=true\n')
                      f.write(f'iteration_name={iteration_name}\n')
                  
                  print(f"→ Will generate report for: {iteration_name}")
                  sys.exit(0)
              
              # Get current date in Eastern Time
              eastern = ZoneInfo("America/New_York")
              today = datetime.now(eastern).date()
              tz_name = "EDT" if datetime.now(eastern).dst() else "EST"
              
              print(f"Today (Eastern Time): {today} {tz_name}")
              print(f"Current timezone: {datetime.now(eastern).tzname()}")
              
              # Read the iteration schedule file
              schedule_file = Path(".github/iteration-schedule.yml")
              
              if not schedule_file.exists():
                  print("Schedule file not found, will check GitHub Projects")
                  scheduled_date = None
              else:
                  with open(schedule_file) as f:
                      config = yaml.safe_load(f)
                  
                  scheduled_date_str = config.get('next_iteration_start_date')
                  if scheduled_date_str:
                      from datetime import date
                      scheduled_date = date.fromisoformat(scheduled_date_str)
                      print(f"Scheduled report date (first day of iteration): {scheduled_date} {tz_name}")
                  else:
                      print("No scheduled date in config")
                      scheduled_date = None
              
              # Check if today matches the scheduled date
              should_generate = False
              iteration_name = None
              
              if scheduled_date and today == scheduled_date:
                  print("✓ Today is the first day of a new iteration (EST/EDT)!")
                  should_generate = True
                  # Read iteration name from config (this will be the previous iteration)
                  if schedule_file.exists():
                      with open(schedule_file) as f:
                          config = yaml.safe_load(f)
                      iteration_name = config.get('previous_iteration_name', 'Unknown')
              else:
                  print("Today is not the first day of a new iteration (EST/EDT)")
                  print("Checking GitHub Projects for current iteration start date...")
                  
                  # Fallback: Check GitHub Projects if no schedule or date doesn't match
                  from agent_mcp_demo.server import get_current_iteration_info
                  
                  token = os.environ.get("GITHUB_TOKEN")
                  org_name = os.environ.get("GITHUB_ORG_NAME")
                  
                  if token and org_name:
                      iteration_info = get_current_iteration_info(token, org_name, "Michigan App Team Task Board")
                      
                      if iteration_info:
                          start_date_str = iteration_info.get('start_date', '')
                          if start_date_str:
                              start_date = datetime.fromisoformat(start_date_str.replace('Z', '+00:00'))
                              start_date_eastern = start_date.astimezone(eastern).date()
                              
                              print(f"Current iteration start date from GitHub: {start_date_eastern} {tz_name}")
                              
                              if today == start_date_eastern:
                                  print("✓ Today is the first day of iteration from GitHub Projects (EST/EDT)!")
                                  should_generate = True
                                  # The function will return the previous iteration on first day
                                  iteration_name = iteration_info.get('name', 'Unknown')
              
              # Write output
              with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
                  if should_generate:
                      f.write('should_generate=true\n')
                      f.write(f'iteration_name={iteration_name or "Unknown"}\n')
                  else:
                      f.write('should_generate=false\n')
              
              if should_generate:
                  print("→ Will generate report for previous iteration")
              else:
                  print("→ Skipping report generation (not start of new iteration)")
                  
          except Exception as e:
              print(f"Error checking date: {e}")
              import traceback
              traceback.print_exc()
              sys.exit(1)
          EOF
          
      - name: Generate and publish report
        if: steps.check_date.outputs.should_generate == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}
          GITHUB_ORG_NAME: ${{ secrets.ORG_NAME || secrets.GITHUB_ORG_NAME || 'WeMoAD-umich' }}
        run: |
          python - << 'EOF'
          import asyncio
          import os
          from agent_mcp_demo.server import github_report_api
          from agent_mcp_demo.utils.report_publisher import ReportPublisher
          
          async def main():
              # Generate report
              print("Generating report...")
              report_content = await github_report_api()
              
              # Check if report generation was successful
              if report_content.startswith("GitHub token not set") or \
                 report_content.startswith("Unexpected error:"):
                  print(f"Error generating report: {report_content}")
                  return False
              
              # Parse iteration info from report
              lines = report_content.split("\n")
              org_name = None
              iteration_name = None
              start_date = None
              end_date = None
              
              for i, line in enumerate(lines):
                  if line.startswith("GitHub Organization:"):
                      org_name = line.split(": ", 1)[1].strip()
                  elif "Iteration Name:" in line:
                      iteration_name = line.split(":", 1)[1].strip()
                  elif "Start Date:" in line:
                      start_date = line.split(":", 1)[1].strip()
                  elif "End Date:" in line:
                      end_date = line.split(":", 1)[1].strip()
              
              if not org_name:
                  print("Could not parse organization name from report")
                  return False
              
              # Publish report
              print(f"Publishing report for {org_name} - {iteration_name}")
              publisher = ReportPublisher()
              result = await publisher.publish_report(
                  report_content=report_content,
                  org_name=org_name,
                  iteration_name=iteration_name,
                  start_date=start_date,
                  end_date=end_date,
                  skip_duplicate_check=False
              )
              
              print(f"Publish result: {result}")
              return result.get("status") == "published"
          
          success = asyncio.run(main())
          exit(0 if success else 1)
          EOF
          
      - name: Update schedule for next iteration
        if: steps.check_date.outputs.should_generate == 'true' && inputs.dry_run != true
        env:
          GITHUB_TOKEN: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}
          GITHUB_ORG_NAME: ${{ secrets.ORG_NAME || secrets.GITHUB_ORG_NAME || 'WeMoAD-umich' }}
        run: |
          python scripts/update_iteration_schedule.py || echo "Failed to update schedule, continuing..."

      - name: Commit and push reports
        if: steps.check_date.outputs.should_generate == 'true' && inputs.dry_run != true
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"

          git add docs/ reports/ .github/iteration-schedule.yml

          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            TIMESTAMP=$(date +'%Y-%m-%d %H:%M:%S %Z')
            git commit -m "Auto-generate report for ${{ steps.check_date.outputs.iteration_name }}

          Generated by GitHub Actions on iteration end date
          Updated schedule for next iteration
          ${TIMESTAMP}"
            git push
          fi

      - name: Upload dry-run artifacts
        # On a dry_run dispatch we skip the commit/push steps above but still
        # want the generated report/docs/schedule delta available for review.
        # `if: always()` so a failure late in generation still surfaces
        # whatever partial output landed on disk.
        if: always() && inputs.dry_run == true && steps.check_date.outputs.should_generate == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: iteration-report-dryrun-${{ steps.check_date.outputs.iteration_name || 'unknown' }}-${{ github.run_number }}
          path: |
            docs/
            reports/
            .github/iteration-schedule.yml
          if-no-files-found: warn
          retention-days: 30

      - name: Summary
        if: steps.check_date.outputs.should_generate == 'true'
        run: |
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            echo "🧪 DRY RUN — report for ${{ steps.check_date.outputs.iteration_name }} generated but NOT committed or pushed."
            echo "   Ref: ${{ github.event_name == 'workflow_dispatch' && inputs.ref || 'main' }}"
            echo "   Download the 'iteration-report-dryrun-*' artifact from this run to inspect docs/, reports/, and iteration-schedule.yml."
          else
            echo "✅ Successfully generated and published report for ${{ steps.check_date.outputs.iteration_name }}"
            echo "📄 Files committed to repository"
            echo "🌐 GitHub Pages will update automatically"
          fi
          echo "ℹ️  All dates are in Eastern Time (EST in winter, EDT in summer)"

  # Daily canary for the mcp2 branch. Runs alongside the production
  # generate-report job on the same cron. GitHub only fires `schedule:` from
  # the default branch, so we drive the mcp2 exercise from here instead of
  # from a workflow file on mcp2 itself.
  #
  # Never publishes: this job does not have contents:write and never runs
  # commit-and-push steps. Failure of this job does NOT block the production
  # job — see `if: always()` on the summary step below.
  mcp2-canary:
    # Run on the schedule and on manual dispatch. Skip on push events that
    # touch this workflow file (redundant with the production job).
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    continue-on-error: true
    steps:
      - name: Checkout mcp2
        uses: actions/checkout@v5
        with:
          ref: mcp2
          # If the branch has been merged/deleted, this step will hard-fail
          # and the whole job goes red — which is the signal you want anyway
          # ("mcp2 no longer exists" → time to stop caring about the canary).

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install dependencies (mcp 2.0)
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install pyyaml
          python -c "import importlib.metadata as m; print('mcp dist version:', m.version('mcp'))"

      - name: Import smoke test
        run: |
          python - << 'EOF'
          from agent_mcp_demo.server import github_report_api, get_current_iteration_info, app, server
          from agent_mcp_demo.agents import core_agent, github_agent, main_coordinator, web_interface_agent
          print("[canary] all mcp2 modules import cleanly on mcp>=2.0")
          EOF

      - name: Dry-run report generation
        env:
          GITHUB_TOKEN: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}
          GITHUB_ORG_NAME: ${{ secrets.ORG_NAME || secrets.GITHUB_ORG_NAME || 'WeMoAD-umich' }}
        run: |
          python - << 'EOF'
          import asyncio, os, sys
          from agent_mcp_demo.server import github_report_api

          report = asyncio.run(github_report_api())
          if not isinstance(report, str):
              print(f"[canary] unexpected return type: {type(report).__name__}", file=sys.stderr)
              sys.exit(2)

          error_prefixes = (
              "GitHub token not set",
              "GitHub organization name not set",
              "GitHub authentication failed",
              "Error accessing organization",
              "Unexpected error:",
          )
          if report.startswith(error_prefixes):
              print(f"[canary] report_api returned an error string: {report[:200]}", file=sys.stderr)
              sys.exit(3)

          with open("mcp2-report.md", "w") as f:
              f.write(report)

          n_lines = report.count("\n") + 1
          n_bytes = len(report.encode("utf-8"))
          print(f"[canary] report_bytes={n_bytes} report_lines={n_lines}")
          print("[canary] --- first 20 lines ---")
          print("\n".join(report.splitlines()[:20]))
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as sm:
              sm.write(f"### mcp2 daily canary\n\n- bytes: **{n_bytes}**\n- lines: **{n_lines}**\n")
          EOF

      - name: Upload canary artifact
        if: always() && hashFiles('mcp2-report.md') != ''
        uses: actions/upload-artifact@v4
        with:
          name: mcp2-daily-canary-${{ github.run_number }}
          path: mcp2-report.md
          retention-days: 30

      - name: Sanity-check report shape
        run: |
          test -s mcp2-report.md
          grep -q '^GitHub Organization: ' mcp2-report.md
          grep -q 'Total commits processed:' mcp2-report.md
          grep -q '^# SUMMARY' mcp2-report.md
          echo "[canary] structural checks passed"
